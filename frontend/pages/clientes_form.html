{% extends "base.html" %}
{% block title %}{{ 'Editar' if cliente else 'Novo' }} Cliente{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
  <h4><i class="bi bi-person me-2"></i>{{ 'Editar' if cliente else 'Novo' }} Cliente</h4>
  <a href="{{ url_for('clientes.index') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i> Voltar
  </a>
</div>
<div class="card" style="max-width:520px;">
  <div class="card-body p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Nome completo *</label>
        <input type="text" name="nome" class="form-control" required
               value="{{ cliente.nome if cliente else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">Telefone</label>
        <input type="text" name="telefone" class="form-control"
               placeholder="(85) 99999-0000"
               value="{{ cliente.telefone if cliente else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">CPF</label>
        <input type="text" name="cpf" class="form-control"
               placeholder="000.000.000-00"
               value="{{ cliente.cpf if cliente else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">E-mail</label>
        <input type="email" name="email" class="form-control"
               value="{{ cliente.email if cliente else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small">Endereço</label>
        <input type="text" name="endereco" class="form-control"
               value="{{ cliente.endereco if cliente else '' }}">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Observações</label>
        <textarea name="observacoes" class="form-control" rows="2">{{ cliente.observacoes if cliente else '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i> Salvar
        </button>
        <a href="{{ url_for('clientes.index') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
