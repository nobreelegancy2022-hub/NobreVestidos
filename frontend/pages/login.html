<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nobre Vestidos — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #18080f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }
    .login-card {
      background: #2e1020;
      border: 1px solid #c2185b;
      border-radius: 16px;
      padding: 2.8rem 2.2rem 2.2rem;
    }

    /* Logo / nome */
    .marca-wrap { text-align: center; margin-bottom: 2rem; }
    .marca-nome {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #e0e8f0;
      line-height: 1.1;
    }
    .marca-nome .d { color: #e8b84b; }
    .marca-sub {
      font-size: 0.78rem;
      color: #f48fb1;
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    /* Linha decorativa dourada */
    .marca-linha {
      width: 40px; height: 2px;
      background: #e8b84b;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    /* Campos */
    .form-label {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #f48fb1; margin-bottom: 5px;
    }
    .form-control {
      background: #220d17; border: 1px solid #c2185b;
      color: #e0e8f0; border-radius: 8px; padding: 10px 14px;
    }
    .form-control:focus {
      background: #220d17; border-color: #e8b84b;
      color: #e0e8f0; box-shadow: 0 0 0 2px rgba(232,184,75,0.15);
    }
    .form-control::placeholder { color: #2a4060; }

    /* Botão */
    .btn-entrar {
      background: #e8b84b; color: #18080f; border: none;
      border-radius: 10px; width: 100%; padding: 12px;
      font-weight: 700; font-size: 0.95rem; letter-spacing: 0.03em;
      cursor: pointer; transition: background 0.15s; margin-top: 0.5rem;
    }
    .btn-entrar:hover { background: #d4a43a; }

    /* Alert */
    .alert-danger {
      background: #2d1111; border: 1px solid #5a2020;
      color: #f87171; border-radius: 8px; font-size: 0.85rem; padding: 10px 14px;
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div class="marca-wrap">
      <div class="marca-nome">NOBRE VESTIDOS</div>
      <div class="marca-sub">Nobre Vestidos</div>
      <div class="marca-linha"></div>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
      <div class="alert-danger mb-3">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Login</label>
        <input type="text" name="email" class="form-control"
               placeholder="Isaac" required autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-entrar">Entrar</button>
    </form>

  </div>
</div>
</body>
</html>
