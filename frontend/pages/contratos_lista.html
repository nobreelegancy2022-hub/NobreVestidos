{% extends "base.html" %}
{% block title %}Contratos


<!-- Banner fallback WhatsApp agradecimento -->
<div class="whats-banner" id="whats-banner">
  <button class="whats-banner-fechar" onclick="fecharBanner()">×</button>
  <div class="whats-banner-txt">
    <strong>Enviar agradecimento</strong><br>
    O pop-up foi bloqueado. Clique para abrir o WhatsApp.
  </div>
  <button class="whats-banner-btn" id="whats-banner-btn" onclick="abrirLinkWhats()">
    <i class="bi bi-whatsapp"></i> Enviar
  </button>
</div>



<script>
// Agradecimento automático ao marcar como devolvido
(function () {
  const params = new URLSearchParams(window.location.search);
  const waLink = params.get('wa_link');
  if (!waLink) return;
  params.delete('wa_link');
  const novaUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  window.history.replaceState({}, '', novaUrl);
  const janela = window.open(waLink, '_blank');
  if (!janela || janela.closed || typeof janela.closed === 'undefined') {
    mostrarBannerWA(waLink);
  }
  function mostrarBannerWA(link) {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:#2a0d1a;border:1px solid #25D366;border-radius:12px;padding:14px 18px;box-shadow:0 4px 20px rgba(0,0,0,0.4);color:#f0d0e0;max-width:300px;';
    banner.innerHTML =
      '<div style="font-size:0.85rem;margin-bottom:8px;">📱 Mensagem de agradecimento pronta! Seu navegador bloqueou a abertura automática.</div>' +
      '<a href="' + link + '" target="_blank" style="display:block;text-align:center;background:#25D366;color:#fff;text-decoration:none;padding:8px;border-radius:8px;font-size:0.85rem;font-weight:600;"><i class="bi bi-whatsapp"></i> Enviar agradecimento</a>';
    document.body.appendChild(banner);
  }
})();
</script>

<script>
async function enviarWA(id, e) {
  e.preventDefault();
  const r = await fetch('/contratos/'+id+'/whatsapp');
  const d = await r.json();
  if (d.link) window.open(d.link, '_blank');
  else alert('Cliente sem telefone cadastrado.');
}
</script>

{% endblock %}
