{% extends "base.html" %}
{% block title %}Contratos


<!-- Banner fallback WhatsApp agradecimento -->
<div class="whats-banner" id="whats-banner">
  <button class="whats-banner-fechar" onclick="fecharBanner()">×</button>
  <div class="whats-banner-txt">
    <strong>Enviar agradecimento</strong><br>
    O pop-up foi bloqueado. Clique para abrir o WhatsApp.
  </div>
  <button class="whats-banner-btn" id="whats-banner-btn" onclick="abrirLinkWhats()">
    <i class="bi bi-whatsapp"></i> Enviar
  </button>
</div>



<script>
// Agradecimento automático ao marcar como devolvido
(function () {
  const params = new URLSearchParams(window.location.search);
  const waLink = params.get('wa_link');
  if (!waLink) return;

  // Limpa da URL imediatamente
  params.delete('wa_link');
  const novaUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  window.history.replaceState({}, '', novaUrl);

  // Decodifica o link
  const link = decodeURIComponent(waLink);

  // Mostra banner para o usuário clicar (navegadores bloqueiam popup sem gesto)
  mostrarBannerWA(link);

  function mostrarBannerWA(link) {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:#2a0d1a;border:2px solid #25D366;border-radius:12px;padding:16px 18px;box-shadow:0 4px 24px rgba(0,0,0,0.5);color:#f0d0e0;max-width:310px;';
    banner.innerHTML =
      '<div style="font-size:0.88rem;margin-bottom:10px;line-height:1.4;">💕 <strong style="color:#f48fb1;">Contrato devolvido!</strong><br>Clique para enviar mensagem de agradecimento.</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<a href="' + link + '" target="_blank" style="flex:1;text-align:center;background:#25D366;color:#fff;text-decoration:none;padding:9px;border-radius:8px;font-size:0.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;"><i class="bi bi-whatsapp"></i> Enviar</a>' +
      '<button onclick="this.parentElement.parentElement.remove()" style="background:#3a1020;border:1px solid #c2185b;color:#f48fb1;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:0.82rem;">Fechar</button>' +
      '</div>';
    document.body.appendChild(banner);
  }
})();
</script>

<script>
async function enviarWA(id, e) {
  e.preventDefault();
  const r = await fetch('/contratos/'+id+'/whatsapp');
  const d = await r.json();
  if (d.link) window.open(d.link, '_blank');
  else alert('Cliente sem telefone cadastrado.');
}
</script>

{% endblock %}
